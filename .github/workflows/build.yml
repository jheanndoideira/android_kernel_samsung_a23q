name: Build Wonderful Kernel A23 with KernelSU

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Server
        uses: rokibhasansagar/slimhub_actions@main
        
      - name: Installing Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y lld binutils clang llvm zip flex bison libncurses-dev gawk libiberty-dev autoconf kmod bc build-essential gcc libc6 curl libstdc++6 git wget libssl-dev cpio p7zip-full ccache
          
      - name: Setup Kernel Source
        uses: actions/checkout@v4

      - name: Add KernelSU Next (Com Susfs)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next-susfs/kernel/setup.sh" | bash -s next-susfs
          
      - name: Download Google Build Tools (O segredo do erro 2)
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master aosp-clang/clang
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 -b android-14.0.0_r0.47 --depth=1 aosp-clang/gcc64
          
      - name: Build Kernel
        run: |
          # Configura os caminhos dos compiladores do Google
          CLANG="$GITHUB_WORKSPACE/aosp-clang/clang/bin"
          GCC64="$GITHUB_WORKSPACE/aosp-clang/gcc64/bin"
          export PATH=$CLANG:$GCC64:$PATH
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          # Tenta o mapa do A23Q (Baseado no seu relato)
          # Se o bengal_a23.confi que você achou for o real, vamos tentar ele também
          make O=out vendor/a23q_eur_open_defconfig || make O=out a23q_defconfig || make O=out bengal_defconfig
          
          # Compilação usando LLVM (Padrão Samsung)
          make -j$(nproc) O=out CC=clang LLVM=1 LLVM_IAS=1

      - name: Upload Image (O Kernel)
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_KSU
          path: out/arch/arm64/boot/Image
