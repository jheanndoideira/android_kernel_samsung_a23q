name: Build Wonderful Kernel + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev git curl

      - name: Import AES Fix (Correção de Criptografia)
        run: |
          mkdir -p arch/arm64/crypto/
          curl -LSs "https://raw.githubusercontent.com/itejo443/android_kernel_samsung_sm7225/ksm/arch/arm64/crypto/aes-modes.S" -o arch/arm64/crypto/aes-modes.S
          echo "Arquivo AES corrigido com sucesso!"

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Procura o arquivo defconfig real dentro das pastas
          REAL_CONF=$(find arch/arm64/configs/ -name "*bengal*" -o -name "*a23*" | head -n 1 | xargs basename)
          
          echo "------------------------------------------"
          if [ -z "$REAL_CONF" ]; then
            echo "Aviso: Nome específico não achado, usando default_defconfig"
            REAL_CONF="default_defconfig"
          else
            echo "Mapa encontrado e selecionado: $REAL_CONF"
          fi
          echo "------------------------------------------"
          
          make $REAL_CONF
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Wonderful_Kernel_A23_KSU
          path: arch/arm64/boot/Image.gz-dtb
