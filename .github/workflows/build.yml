name: Build Kernel A23 - FORÇA BRUTA FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Compilar Kernel
        run: |
          # 1. Variáveis de Ambiente
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 2. Correção de caminho e vDSO
          mkdir -p out
          VDSO_MAKEFILE="arch/arm64/kernel/vdso/Makefile"
          sed -i 's/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags)/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags) -fPIC -fno-stack-protector/g' $VDSO_MAKEFILE
          
          # 3. Configuração Inicial
          make O=out rsuntk_defconfig
          
          # 4. O PULO DO GATO: O comando 'yes' responde 'Enter' para todas as perguntas chatas
          echo "--- RESOLVENDO CONFIGS NOVAS ---"
          yes "" | make O=out olddefconfig
          
          # 5. COMPILAÇÃO REAL (Foco na Image)
          echo "--- INICIANDO COMPILAÇÃO (AGUARDE 10-20 MIN) ---"
          yes "" | make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          AR=llvm-ar-15 \
          NM=llvm-nm-15 \
          OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 \
          STRIP=llvm-strip-15 \
          LLVM_IAS=0 \
          KBUILD_MODPOST
