name: Build Wonderful Kernel A23 - SAFE CODE FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Server
        uses: rokibhasansagar/slimhub_actions@main

      - name: Installing Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y lld binutils clang llvm zip flex bison libncurses-dev gawk libiberty-dev autoconf kmod bc build-essential gcc libc6 curl libstdc++6 git wget libssl-dev cpio p7zip-full ccache
          
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Google Build Tools
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --single-branch -b master aosp-clang/clang
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 --single-branch -b android-14.0.0_r0.47 aosp-clang/gcc64
          
      - name: Build Kernel (Safe Toolchain Fix)
        run: |
          CLANG_BIN="$GITHUB_WORKSPACE/aosp-clang/clang/bin"
          GCC_BIN="$GITHUB_WORKSPACE/aosp-clang/gcc64/bin"
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          make mrproper
          mkdir -p out
          
          # Gera a config oficial da Samsung
          make O=out rsuntk_defconfig
          
          echo "--- CORRIGINDO CONFLITOS DE SEGURANÇA ---"
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable SYSTEM_REVOCATION_LIST
          
          # Força a aceitação das novas opções sem travar
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO COM MODO COMPATIBILIDADE ---"
          # LLVM_IAS=0 força o uso do assembler do GCC (Binutils)
          # Isso resolve o 'junk at end of line' sem precisar deletar arquivos
          yes "" | make -j2 O=out \
          CC=clang \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_KSU_SafeFix
          path: out/arch/arm64/boot/Image
