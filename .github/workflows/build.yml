name: Build Kernel A23 - vDSO STACK FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Build Kernel (Fixing vDSO Relocation)
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # --- LIMPEZA CIRÚRGICA DO vDSO ---
          # 1. Removemos todas as menções a stack-protector no vDSO
          sed -i 's/-fstack-protector//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fstack-protector-strong//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fstack-protector-all//g' arch/arm64/kernel/vdso/Makefile
          
          # 2. Forçamos o vDSO a ser compilado sem essas flags (Fix do erro de Relocation)
          echo "CFLAGS_REMOVE_vgettimeofday.o = -fstack-protector -fstack-protector-strong -fstack-protector-all" >> arch/arm64/kernel/vdso/Makefile
          
          # 3. Limpeza do Junk (Sua descoberta)
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile

          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Ajustes Anti-Panic e GSI Android 16
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable STACKPROTECTOR
          scripts/config --file out/.config --disable STACKPROTECTOR_STRONG
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO ---"
          # LLVM_IAS=0 é vital para o vDSO da Samsung!
          make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          AR=llvm-ar-15 \
          NM=llvm-nm-15 \
          OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 \
          STRIP=llvm-strip-15 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_vDSO_Fixed
          path: out/arch/arm64/boot/Image
