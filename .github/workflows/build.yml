name: Build A235M Ultra - Next + SUSFS (No-404 Edition)
on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Nome do Defconfig'
        default: 'a23q_defconfig'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: potatogeek/kernel-a235m-f
        ref: main
        path: kernel_source
        fetch-depth: 1

    - name: Instalar Dependências
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison git gcc g++ python-is-python3 tar perl curl libc++-dev lz4 libssl-dev -y

    - name: Baixar Toolchains (Google Official)
      run: |
        mkdir toolchains
        cd toolchains
        mkdir clang && cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz && rm clang-r522817.tar.gz
        cd ..
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google
      working-directory: kernel_source

    - name: Injetar KernelSU Next (Método Manual)
      run: |
        echo "=== Clonando KernelSU Next ==="
        git clone --depth 1 https://github.com/rifsytn/KernelSU-Next drivers/kernelsu
        
        echo "=== Injetando no Sistema de Arquivos ==="
        # Adiciona ao Makefile e Kconfig para o compilador enxergar o KSU
        echo "obj-y += kernelsu/" >> drivers/Makefile
        sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
        
        echo "KernelSU Next injetado com sucesso!"
      working-directory: kernel_source

    - name: Injetar SUSFS
      run: |
        echo "=== Preparando SUSFS 1.5.5 ==="
        cd ..
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        
        cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
        
        cd kernel_source
        # Patch automático em modo batch para não travar
        patch -p1 --batch --silent < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || echo "Patch com avisos, mas prosseguindo..."
      working-directory: kernel_source

    - name: Compilar Kernel (Turbo Mode)
      id: buildKernel
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # Flags de Performance
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto -mllvm -polly"
        
        cd kernel_source
        make -C . O=out ${{ github.event.inputs.DEFCONFIG }}

        # Ativar Flags de Root e Invisibilidade
        echo "CONFIG_KSU=y" >> out/.config
        echo "CONFIG_KSU_SUSFS=y" >> out/.config
        echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> out/.config
        echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> out/.config

        # Compilação
        make -j$(nproc --all) -C . O=out \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu-

        echo "details=A235M-ULTRA-NEXT-SUSFS-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      working-directory: .

    - name: Enviar Kernel (Image)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildKernel.outputs.details }}
        path: kernel_source/out/arch/arm64/boot/Image
