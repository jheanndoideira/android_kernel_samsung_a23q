name: Build Wonderful Kernel A23 - PATH FIXED

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Build Tools
        run: |
          # Baixando o Clang e o GCC em pastas simples
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --single-branch -b master $GITHUB_WORKSPACE/clang-tools
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 --single-branch -b android-14.0.0_r0.47 $GITHUB_WORKSPACE/gcc-tools
          
      - name: Build Kernel (Fix Not Found)
        run: |
          # Definindo caminhos absolutos e conferindo se existem
          CLANG_BIN="$GITHUB_WORKSPACE/clang-tools/bin"
          GCC_BIN="$GITHUB_WORKSPACE/gcc-tools/bin"
          
          # Garante que o executável tem permissão
          chmod +x $CLANG_BIN/clang
          
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Fix do vDSO que você confirmou que funciona!
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Desativa travas
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO ---"
          # Usamos o comando direto para não ter erro de "not found"
          yes "" | make -j$(nproc --all) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          LLVM=1 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_Final_PathFixed
          path: out/arch/arm64/boot/Image
