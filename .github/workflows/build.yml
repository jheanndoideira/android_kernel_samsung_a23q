name: Build Wonderful Kernel A23 - EXPERT ANALYSIS FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Server
        uses: rokibhasansagar/slimhub_actions@main

      - name: Installing Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y lld binutils clang llvm zip flex bison libncurses-dev gawk libiberty-dev autoconf kmod bc build-essential gcc libc6 curl libstdc++6 git wget libssl-dev cpio p7zip-full ccache
          
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Google Build Tools
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --single-branch -b master aosp-clang/clang
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 --single-branch -b android-14.0.0_r0.47 aosp-clang/gcc64
          
      - name: Build Kernel (Toolchain Path Fix)
        run: |
          # 1. Definindo Caminhos Absolutos (conforme sua análise sugeriu)
          export CLANG_PATH="$GITHUB_WORKSPACE/aosp-clang/clang/bin"
          export GCC_PATH="$GITHUB_WORKSPACE/aosp-clang/gcc64/bin"
          export PATH="$CLANG_PATH:$GCC_PATH:$PATH"
          
          # 2. Variáveis de Ambiente Explícitas
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # 3. Limpeza Profunda (conforme sua análise sugeriu)
          make mrproper
          rm -rf out
          mkdir -p out
          
          # 4. Configuração
          make O=out rsuntk_defconfig
          
          # 5. Correção Cirúrgica no Makefile do vDSO (Removendo flags incompatíveis do host)
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          
          # 6. Compilação Forçando o Montador Correto
          # LLVM_IAS=0 força o uso do 'aarch64-linux-android-as' (o montador correto)
          yes "" | make -j$(nproc --all) O=out \
          CC="$CLANG_PATH/clang" \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE="$GCC_PATH/aarch64-linux-android-" \
          CROSS_COMPILE_ARM32="$GCC_PATH/arm-linux-androideabi- \
          LLVM=1 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_KSU_Expert_Fix
          path: out/arch/arm64/boot/Image
