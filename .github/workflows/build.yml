name: Build Kernel A23 - NATHAN WIKI FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Tools
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 $GITHUB_WORKSPACE/clang-tools
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 $GITHUB_WORKSPACE/gcc-tools
          
      - name: Build Kernel (Cleaning Junk like Nathan)
        run: |
          # Achar os compiladores
          CLANG_BIN=$(find $GITHUB_WORKSPACE/clang-tools -name clang -type f -executable | head -n 1 | xargs dirname)
          GCC_BIN=$(find $GITHUB_WORKSPACE/gcc-tools -name "aarch64-linux-android-gcc" -type f -executable | head -n 1 | xargs dirname)
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          # A LIÇÃO DO NATHAN: Limpar as diretivas que o assembler não entende
          # Removemos flags que injetam "lixo" (caracteres especiais) no assembly do vDSO
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fstack-protector-strong//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fstack-protector//g' arch/arm64/kernel/vdso/Makefile
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Desativar travas (essencial para GSI Android 16)
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO SEM LIXO ---"
          # LLVM_IAS=0 força o uso do assembler do GCC (que agora receberá código limpo)
          yes "" | make -j$(nproc --all) O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_Nathan_Fix
          path: out/arch/arm64/boot/Image
