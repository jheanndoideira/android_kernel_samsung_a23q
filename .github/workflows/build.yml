name: Build Kernel A23 - FINAL IMAGE FOCUS

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Build Kernel (Skip DTB Error)
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Fix do vDSO (Solução que você pesquisou!)
          VDSO_MAKEFILE="arch/arm64/kernel/vdso/Makefile"
          sed -i 's/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags)/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags) -fPIC -fno-stack-protector/g' $VDSO_MAKEFILE
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Ajustes Anti-Panic e GSI
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable STACKPROTECTOR
          scripts/config --file out/.config --disable STACKPROTECTOR_STRONG
          scripts/config --file out/.config --disable PANIC_ON_OOPS
          scripts/config --file out/.config --set-val PANIC_TIMEOUT 0
          
          make O=out olddefconfig
          
          echo "--- COMPILANDO APENAS A IMAGE ---"
          # O SEGREDO: Em vez de 'make', usamos 'make Image' para ignorar os DTBs bugados da Samsung
          make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          AR=llvm-ar-15 \
          NM=llvm-nm-15 \
          OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 \
          STRIP=llvm-strip-15 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon" \
          Image 

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_Final_Image
          path: out/arch/arm64/boot/Image
