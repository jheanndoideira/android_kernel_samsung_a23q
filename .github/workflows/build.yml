name: Build Wonderful Kernel + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev git curl

      - name: Import AES Fix
        run: |
          mkdir -p arch/arm64/crypto/
          curl -LSs "https://raw.githubusercontent.com/itejo443/android_kernel_samsung_sm7225/ksm/arch/arm64/crypto/aes-modes.S" -o arch/arm64/crypto/aes-modes.S
          echo "Correção AES aplicada!"

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # Limpeza profunda para evitar o Erro 2
          make mrproper
          
          # Tenta encontrar o arquivo 'bengal_a23.confi' ou similares
          # O comando abaixo procura o arquivo e tenta usá-lo automaticamente
          CONF=$(find arch/arm64/configs/ -name "*bengal_a23*" | head -n 1 | sed 's|arch/arm64/configs/||')
          
          if [ -z "$CONF" ]; then
            echo "Aviso: bengal_a23 não encontrado por busca, tentando nomes padrão..."
            make a23q_defconfig || make bengal_defconfig || make vendor/bengal_defconfig || make default_defconfig
          else
            echo "Sucesso! Usando o arquivo encontrado: $CONF"
            make $CONF
          fi
          
          # Compilação real
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Wonderful_Kernel_A23_KSU
          path: arch/arm64/boot/Image.gz-dtb
