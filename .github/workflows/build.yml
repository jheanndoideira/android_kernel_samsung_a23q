name: Build A235M Ultimate (Clang 12 + Performance)
on:
  workflow_dispatch:
    inputs:
      DICA_CONFIG:
        description: 'Dica do nome (deixe a23q)'
        default: 'a23q'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: potatogeek/kernel-a235m-f
        ref: main
        path: kernel_source
        fetch-depth: 1

    - name: Instalar Dependências e Fix Python 2
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
        # Força Python 2 para evitar erro de sintaxe nos scripts da Samsung
        sudo ln -sf /usr/bin/python2 /usr/bin/python
      working-directory: .

    - name: Baixar Toolchains (Clang 12 Estável)
      run: |
        mkdir toolchains && cd toolchains
        mkdir clang && cd clang
        # Usando Clang r416183b1 (Versão 12) - Corrige o erro "literal value out of range"
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b1.tar.gz
        tar -xf clang-r416183b1.tar.gz && rm clang-r416183b1.tar.gz
        cd ..
        # GCC 4.9 para compatibilidade
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google
      working-directory: .

    - name: Injetar KernelSU Next (Manual)
      run: |
        cd kernel_source
        echo "=== Clonando KernelSU Next ==="
        # Clona direto na branch 'next' para evitar erros de pathspec
        git clone --depth 1 https://github.com/rifsxd/KernelSU-Next -b next drivers/kernelsu
        
        # Configura o kernel para reconhecer o KSU
        echo "obj-y += kernelsu/" >> drivers/Makefile
        sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
      working-directory: .

    - name: Injetar SUSFS 1.5.5
      run: |
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
        cd kernel_source
        # Tenta aplicar o patch automaticamente, se falhar, continua
        patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
        # Garante a compilação no Makefile
        if ! grep -q "susfs" fs/Makefile; then echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile; fi
      working-directory: .

    - name: Configurar Kernel (Performance Extrema)
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=clang
        
        cd kernel_source
        
        # 1. Localiza o arquivo de configuração (mesmo se estiver na pasta vendor)
        TARGET_FILE=$(find arch/arm64/configs -name "*${{ github.event.inputs.DICA_CONFIG }}*defconfig*" | head -n 1)
        if [ -z "$TARGET_FILE" ]; then echo "ERRO: Config não encontrada"; exit 1; fi
        MAKE_TARGET=${TARGET_FILE#arch/arm64/configs/}
        
        echo "Usando config base: $MAKE_TARGET"
        
        make clean && make mrproper
        make $MAKE_TARGET
        
        echo "=== ATIVANDO TURBO MODE ==="
        
        # Ativa Root e Invisibilidade
        ./scripts/config --file .config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT
        
        # OTIMIZAÇÕES DE CPU
        ./scripts/config --file .config \
            --enable CONFIG_JUMP_LABEL \
            --enable CONFIG_HZ_300
        
        # REMOVE PESO MORTO (Samsung Bloat & Segurança Excessiva)
        ./scripts/config --file .config \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_SAMSUNG_DEBUG \
            --disable CONFIG_FTRACE \
            --disable CONFIG_PROFILING \
            --disable CONFIG_STACKPROTECTOR_STRONG \
            --disable CONFIG_SOFTLOCKUP_DETECTOR \
            --disable CONFIG_HARDLOCKUP_DETECTOR
        
        # O PULO DO GATO: Responde "Sim/Não" automaticamente para tudo e evita travar
        make olddefconfig
      working-directory: .

    - name: Compilar Kernel
      id: buildKernel
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        # Flags O3 sem polly (para estabilidade no Clang 12)
        export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto"
        
        cd kernel_source
        
        echo "Iniciando compilação..."
        make -j$(nproc --all) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 LLVM_IAS=1

        echo "details=A235M-ULTIMATE-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      working-directory: .

    - name: Criar VBMeta Disabled
      run: |
        wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
        # Usa python3 explicitamente para a ferramenta AVB
        python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img
      working-directory: .

    - name: Enviar Tudo (Kernel + VBMeta)
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildKernel.outputs.details }}
        path: |
          kernel_source/arch/arm64/boot/Image
          vbmeta_disabled.img
