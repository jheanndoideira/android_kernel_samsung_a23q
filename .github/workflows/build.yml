  name: Build A235M Performance (KSU Next + SUSFS)
on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Nome do Defconfig'
        default: 'a23q_defconfig'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: potatogeek/kernel-a235m-f
        ref: main
        path: kernel_source
        fetch-depth: 1

    - name: Instalar Dependências
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison git gcc g++ python-is-python3 tar perl curl libc++-dev lz4 libssl-dev -y

    - name: Baixar Toolchains (Otimizadas)
      run: |
        mkdir toolchains
        cd toolchains
        # Clang Google
        mkdir clang && cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz && rm clang-r522817.tar.gz
        cd ..
        # GCC para compatibilidade
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google
      working-directory: .

    - name: Injetar KernelSU Next (Link Corrigido)
      run: |
        echo "=== Baixando KernelSU Next ==="
        cd kernel_source
        # AQUI ESTAVA O ERRO: Usando curl oficial do rifsxd para evitar erro 404
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        echo "KernelSU Next configurado com sucesso!"
      working-directory: .

    - name: Injetar SUSFS 1.5.5
      run: |
        echo "=== Baixando SUSFS ==="
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        
        # Copiando arquivos essenciais
        cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
        
        cd kernel_source
        
        # Tentativa de patch automático. Se falhar, fazemos manual.
        # O "|| true" impede que o script pare se houver um erro pequeno de patch
        patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
        
        # Garantia: Se o patch falhou em adicionar ao Makefile, adicionamos na força bruta
        if ! grep -q "susfs" fs/Makefile; then
            echo "Forçando SUSFS no Makefile..."
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
        fi
      working-directory: .

    - name: Preparar e Limpar (Debloat de Performance)
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=clang
        
        cd kernel_source
        make clean && make mrproper
        make ${{ github.event.inputs.DEFCONFIG }}
        
        echo "=== APLICANDO OTIMIZAÇÕES DE FPS ==="
        
        # 1. Ativar KSU e SUSFS
        ./scripts/config --file .config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT
            
        # 2. REMOVER DEBUG (Isso libera CPU para Jogo!)
        # Desativa logs excessivos, checagens de memória e tracing
        ./scripts/config --file .config \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_FRAME_POINTER \
            --disable CONFIG_KALLSYMS \
            --disable CONFIG_KALLSYMS_ALL \
            --disable CONFIG_SCHED_DEBUG \
            --disable CONFIG_SCHED_INFO \
            --disable CONFIG_FTRACE \
            --disable CONFIG_PROFILING
            
        echo "Configuração otimizada aplicada."
      working-directory: .

    - name: Compilar Kernel (Modo Turbo)
      id: buildKernel
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # Flags de Otimização Agressiva
        export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto -mllvm -polly"
        
        cd kernel_source
        
        echo "Iniciando compilação..."
        make -j$(nproc --all) \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LLVM=1 \
            LLVM_IAS=1

        echo "details=A235M-PERF-KSU-NEXT-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      working-directory: .

    - name: Verificar Arquivo
      run: |
        if [ -f kernel_source/arch/arm64/boot/Image ]; then
            echo "SUCESSO: Kernel compilado!"
        else
            echo "FALHA: Arquivo Image não gerado."
            exit 1
        fi

    - name: Enviar Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildKernel.outputs.details }}
        path: kernel_source/arch/arm64/boot/Image
    
