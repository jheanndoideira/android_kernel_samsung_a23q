name: Build Kernel A23 - FINAL vDSO FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Build Kernel (Surgical Relocation Fix)
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # --- A MARRETA NO VDSO ---
          # 1. Forçamos o Makefile do vDSO a desativar o Stack Protector em todas as frentes
          sed -i 's/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags)/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags) -fno-stack-protector -fPIC/g' arch/arm64/kernel/vdso/Makefile
          
          # 2. Limpamos as flags que causam o "Junk" e as Relocations
          sed -i 's/-fstack-protector//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fstack-protector-strong//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          
          # 3. Injetamos um comando para garantir que o compilador ignore a proteção de pilha aqui
          echo "CFLAGS_vgettimeofday.o = -fno-stack-protector -fPIC" >> arch/arm64/kernel/vdso/Makefile
          echo "CFLAGS_gettimeofday.o = -fno-stack-protector -fPIC" >> arch/arm64/kernel/vdso/Makefile

          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Ajustes GSI Android 16 e Segurança
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable STACKPROTECTOR
          scripts/config --file out/.config --disable STACKPROTECTOR_STRONG
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO ---"
          # LLVM_IAS=0 mantém o assembler estável que você validou
          make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          AR=llvm-ar-15 \
          NM=llvm-nm-15 \
          OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 \
          STRIP=llvm-strip-15 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_vDSO_Success
          path: out/arch/arm64/boot/Image
