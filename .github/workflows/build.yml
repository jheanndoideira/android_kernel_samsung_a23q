name: Build A235M Ultimate (Debug + Fixes)
on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: 'Nome do Defconfig (Ex: a23q_defconfig)'
        default: 'a23q_defconfig'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4
      with:
        repository: potatogeek/kernel-a235m-f
        ref: main
        path: kernel_source
        fetch-depth: 1

    - name: Instalar Dependências e Fix Python 2
      run: |
        sudo apt update -y
        # Instala Python 2 e ferramentas essenciais
        sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
        
        # O TRUQUE: Força o sistema a usar Python 2 (resolve o erro SyntaxError)
        sudo ln -sf /usr/bin/python2 /usr/bin/python
        
        echo "Versão do Python ativa:"
        python --version
      working-directory: .

    - name: Baixar Toolchains (Clang + GCC)
      run: |
        mkdir toolchains
        cd toolchains
        
        # Clang Google (Oficial)
        mkdir clang && cd clang
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz && rm clang-r522817.tar.gz
        cd ..
        
        # GCC 4.9 (Essencial para Samsung 4.19)
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google
      working-directory: .

    - name: Injetar KernelSU Next
      run: |
        echo "=== Baixando KernelSU Next ==="
        cd kernel_source
        curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next
      working-directory: .

    - name: Injetar SUSFS 1.5.5
      run: |
        echo "=== Baixando SUSFS ==="
        git clone https://gitlab.com/simonpunk/susfs4ksu.git
        
        cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
        cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
        
        cd kernel_source
        # Tenta aplicar patch (se falhar, ignora e fazemos manual no makefile)
        patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
        
        # Garante a inclusão no Makefile
        if ! grep -q "susfs" fs/Makefile; then
            echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile
        fi
      working-directory: .

    - name: Configurar e Otimizar (Passo Crítico)
      run: |
        export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CC=clang
        
        cd kernel_source
        
        echo "=== M
