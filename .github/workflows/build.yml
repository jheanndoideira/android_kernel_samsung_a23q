name: Build Kernel A23 4G Turbo
on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: Defconfig
        default: 'vendor/rsuntk_defconfig'
        required: true
      KSU:
        description: Enable KernelSU support
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: rsuntkOrgs/android_kernel_samsung_a23
        ref: android-4.19-stable
        path: android_kernel_samsung_a23
        fetch-depth: 1
        
    - name: Prepare dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison git gcc g++ python-is-python3 tar perl curl libc++-dev lz4 libssl-dev -y
        
    - name: Fetch Toolchain (Clang 18)
      run: |
        mkdir toolchains
        cd toolchains
        mkdir clang-18 && cd clang-18
        # Clang 18 é essencial para performance no Android 14/16
        wget -q -O clang18.tar.gz https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang18.tar.gz && rm clang18.tar.gz
        cd ..
        git clone --depth=1 https://gitlab.com/Rissu-Projekt/toolchains/aarch64-linux-android.git google
      working-directory: android_kernel_samsung_a23

    - name: Build kernel (Turbo Mode)
      id: buildKernel
      run: |
        # Configurando o PATH corretamente para o Clang 18
        export PATH=$(pwd)/toolchains/clang-18/bin:$(pwd)/toolchains/google/bin:$PATH
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export ARCH=arm64
        
        # --- INJEÇÃO DE PERFORMANCE ---
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        # Otimização -O3 e otimização para o processador Cortex-A73/A53 do SD680
        export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto"
        # ------------------------------

        # Aplicar KernelSU se solicitado
        if [[ "${{ github.event.inputs.KSU }}" == "true" ]]; then
            curl -LSs "https://raw.githubusercontent.com/rifsytn/KernelSU-Next/main/kernel/setup.sh" | bash -s main
        fi

        # Comando de build corrigido (sem os 'echo' perdidos)
        bash build_kernel.sh ${{ github.event.inputs.DEFCONFIG }} ${{ github.event.inputs.KSU }} $(nproc --all)

        # Exportar variáveis para o upload
        echo "buildDetails=A23q-Turbo-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
      working-directory: android_kernel_samsung_a23
      
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildKernel.outputs.buildDetails }}
        path: android_kernel_samsung_a23/out/arch/arm64/boot/Image
