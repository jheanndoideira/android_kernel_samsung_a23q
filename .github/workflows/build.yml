name: VBMeta_Factory_Samsung
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "🛠️ 1. Setup Environment"
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip tar

      - name: "📥 2. Download AVBTool (LineageOS Official)"
        run: |
          # Baixando a ferramenta oficial da LineageOS (mais confiável)
          curl -LO https://raw.githubusercontent.com/LineageOS/android_external_avb/lineage-20.0/avbtool.py
          chmod +x avbtool.py

      - name: "🏭 3. Generate VBMeta Variants"
        run: |
          mkdir -p output

          echo "--- VARIANTE 1: Standard (4KB) ---"
          # Essa é a padrão (que deu 10KB no final). Vamos tentar mudar o algoritmo.
          python3 avbtool.py make_vbmeta_image \
            --flags 2 \
            --padding_size 4096 \
            --output output/vbmeta_v1_std.img

          echo "--- VARIANTE 2: Samsung Safe (8KB) ---"
          # Dobramos o tamanho. Samsung gosta de blocos de 8KB ou 16KB.
          python3 avbtool.py make_vbmeta_image \
            --flags 2 \
            --padding_size 8192 \
            --output output/vbmeta_v2_8kb.img

          echo "--- VARIANTE 3: Big Block (16KB) ---"
          # Tamanho maior para garantir que o Odin não reclame de "Size".
          python3 avbtool.py make_vbmeta_image \
            --flags 2 \
            --padding_size 16384 \
            --output output/vbmeta_v3_16kb.img

      - name: "📦 4. Package TARs (Odin Ready)"
        run: |
          cd output
          
          # Empacota cada uma em um .tar separado para o Odin
          tar -cvf vbmeta_v1_std.tar vbmeta_v1_std.img
          # Renomeia dentro do tar para o Odin reconhecer sempre como vbmeta.img
          mv vbmeta_v2_8kb.img vbmeta.img
          tar -cvf vbmeta_v2_8kb.tar vbmeta.img
          
          mv vbmeta_v3_16kb.img vbmeta.img
          tar -cvf vbmeta_v3_16kb.tar vbmeta.img
          
          # Remove os .img soltos para não confundir
          rm vbmeta.img vbmeta_v1_std.img

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: VBMeta_Collection
          path: output/*.tar
