name: Build Kernel A23 - GSI Android 16 FINAL

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Tools
        run: |
          # Baixando ferramentas em locais limpos
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 $GITHUB_WORKSPACE/clang-tools
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 $GITHUB_WORKSPACE/gcc-tools
          
      - name: Build Kernel (Auto Path Detection)
        run: |
          # LOCALIZAÇÃO AUTOMÁTICA (Para nunca mais dar 'Not Found')
          CLANG_PATH=$(find $GITHUB_WORKSPACE/clang-tools -name clang -type f -executable | head -n 1 | xargs dirname)
          GCC_PATH=$(find $GITHUB_WORKSPACE/gcc-tools -name "aarch64-linux-android-gcc" -type f -executable | head -n 1 | xargs dirname)
          
          if [ -z "$CLANG_PATH" ] || [ -z "$GCC_PATH" ]; then
            echo "ERRO: Compiladores não encontrados!"
            exit 1
          fi

          export PATH="$CLANG_PATH:$GCC_PATH:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Fix do vDSO (Aquele que você descobriu que resolve o Junk)
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          echo "CFLAGS_REMOVE_vgettimeofday.o = -fstack-protector -fstack-protector-strong" >> arch/arm64/kernel/vdso/Makefile

          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Ajustes para GSI e Android 16
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO AGORA ---"
          # LLVM_IAS=0 usa o montador do GCC que aceita o código da Samsung
          yes "" | make -j$(nproc --all) O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_GSI_Final
          path: out/arch/arm64/boot/Image
