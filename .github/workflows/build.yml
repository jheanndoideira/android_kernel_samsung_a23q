name: A23_V31_HOMECOMING
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout YOUR Repo (Where rsuntk_defconfig lives)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # REMOVI A LINHA 'repository'. AGORA ELE USA O SEU CÓDIGO!

      - name: "Setup Environment (Clang 15)"
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential libssl-dev bison flex device-tree-compiler python3 python2
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: "Inject KSU Next, SUSFS & WireGuard"
        run: |
          # 1. KernelSU Next
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
          
          # Fix KSU Compatibilidade
          sed -i 's/TWA_RESUME/1/g' drivers/kernelsu/allowlist.c
          sed -i 's/atomic_set(&current->seccomp.filter_count, 0);/\/\/ atomic_set(&current->seccomp.filter_count, 0);/g' drivers/kernelsu/app_profile.c
          
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # Fix pgtable
          echo "#include <asm/pgtable.h>" > include/linux/pgtable.h

          # 2. SUSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

          # 3. WireGuard
          git clone --depth 1 https://github.com/WireGuard/wireguard-linux-compat.git
          cp -R wireguard-linux-compat/src drivers/net/wireguard
          echo "obj-y += wireguard/" >> drivers/net/Makefile

      - name: "Apply Critical Patches & Fixes"
        run: |
          # Patches do seu script original
          sed -i 's/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags)/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags) -fPIC -fno-stack-protector/g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/static void print_ssr_history()/static void print_ssr_history(void)/g' drivers/adsp_factory/ssc_core.c
          
          # FIX PYTHON 2 vs 3 (O erro de parenteses)
          # Isso é necessário porque o source base ainda é antigo
          sed -i 's/print "error, forbidden warning:", m.group(2)/print("error, forbidden warning:", m.group(2))/g' scripts/gcc-wrapper.py
          sed -i 's/print "warning, allowed warning:", m.group(2)/print("warning, allowed warning:", m.group(2))/g' scripts/gcc-wrapper.py
          
          # FIX HEADERS DE AUDIO/DISPLAY
          cp -r techpack/audio/asoc/codecs/tas256x/physical_layer/inc/*.h include/linux/ 2>/dev/null || true
          cp -r techpack/display/pll/*.h include/linux/ 2>/dev/null || true

      - name: "Configure & Optimize (Usando rsuntk_defconfig)"
        run: |
          mkdir -p out
          
          # AGORA VAI ACHAR: Estamos na raiz do seu repo e ARCH=arm64
          make O=out ARCH=arm64 rsuntk_defconfig

          # --- OTIMIZAÇÕES ---
          scripts/config --file out/.config --enable CONFIG_LTO_CLANG_FULL
          scripts/config --file out/.config --enable CONFIG_LLVM_POLLY
          scripts/config --file out/.config --enable CONFIG_HZ_300
          scripts/config --file out/.config --enable CONFIG_PREEMPT
          scripts/config --file out/.config --enable CONFIG_TCP_CONG_BBR
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          scripts/config --file out/.config --enable CONFIG_IOSCHED_MAPLE
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_IOSCHED "maple"
          
          # --- FEATURES ---
          scripts/config --file out/.config --enable CONFIG_ZRAM_DEF_COMP_ZSTD
          scripts/config --file out/.config --enable CONFIG_ZSMALLOC
          scripts/config --file out/.config --enable CONFIG_PSI
          scripts/config --file out/.config --enable CONFIG_BPF_JIT
          scripts/config --file out/.config --enable CONFIG_KSU
          scripts/config --file out/.config --enable CONFIG_KSU_SUSFS
          scripts/config --file out/.config --enable CONFIG_WIREGUARD

          # --- FIXES ---
          scripts/config --file out/.config --enable SECTION_MISMATCH_WARN_ONLY
          scripts/config --file out/.config --disable REFCOUNT_FULL
          scripts/config --file out/.config --disable PANIC_ON_REFCOUNT_ERROR
          scripts/config --file out/.config --disable SHADOW_CALL_STACK
          scripts/config --file out/.config --disable RELR
          scripts/config --file out/.config --disable CONFIG_RKP_KDP
          scripts/config --file out/.config --disable CONFIG_TIMA
          scripts/config --file out/.config --disable CONFIG_SEC_RESTRICT_ROOTING
          
          # Aceita e gera o .config final
          yes "" | make O=out ARCH=arm64 olddefconfig

      - name: "Compile (Targets: DTBO + Image.gz-dtb)"
        run: |
          # Definição de Includes
          TP_PLL="-I$(pwd)/techpack/display/pll"
          TP_CAM="$(pwd)/techpack/camera/drivers/cam_sensor_module"
          CAM_INC="-I$TP_CAM/cam_cci -I$TP_CAM/cam_sensor_io -I$TP_CAM/cam_sensor_utils -I$(pwd)/techpack/camera/drivers/cam_req_mgr"
          
          export KCFLAGS="-O3 -Ofast -w -Wno-error -fno-builtin -fcommon $TP_PLL $CAM_INC"
          
          echo "--- COMPILANDO NO SEU REPO ---"
          
          yes "" | make -j$(nproc --all) O=out \
          ARCH=arm64 \
          CC=clang-15 \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          LD=ld.lld-15 AR=llvm-ar-15 NM=llvm-nm-15 \
          LLVM_IAS=0 \
          DTC_FLAGS="-@" \
          KBUILD_MODPOST_WARN=1 \
          CONFIG_SECTION_MISMATCH_WARN_ONLY=y \
          dtbo.img Image.gz-dtb

      - name: "Generate VBMeta (Disabled)"
        run: |
          curl -LO https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          chmod +x avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta.img
          tar -cvf vbmeta_disabled.tar vbmeta.img

      - name: "Package ZIP (AnyKernel3)"
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.1/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          
          # Copia Kernel
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          else
             # Fallback para Image se falhar o gz-dtb
             cp out/arch/arm64/boot/Image AnyKernel3/Image.gz-dtb
          fi
          
          # Copia DTBO
          if [ -f out/arch/arm64/boot/dtbo.img ]; then
            cp out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img
          fi
          
          cd AnyKernel3 && zip -r9 ../A23-V31-HOMECOMING.zip *

      - name: "Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: A23_V31_HOMECOMING
          path: |
            A23-V31-HOMECOMING.zip
            vbmeta_disabled.tar
            vbmeta.img
