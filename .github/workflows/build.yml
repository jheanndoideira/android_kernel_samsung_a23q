name: Build Kernel A23 - POWER BUTTON BROKEN FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Compilers
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Build Kernel (Safe ADB Mode)
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Fix do vDSO (Anti-Junk)
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # CONFIGURAÇÕES DE EMERGÊNCIA (Botão Power Quebrado)
          # 1. Permite que o ADB funcione mesmo se o boot falhar
          scripts/config --file out/.config --enable USB_G_ANDROID
          scripts/config --file out/.config --enable USB_CONFIGFS_F_FS
          # 2. Desativa travas da Samsung e Kernel Panic
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable PANIC_ON_OOPS
          scripts/config --file out/.config --set-val PANIC_TIMEOUT 0
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO ---"
          make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_BrokenPower_Fix
          path: out/arch/arm64/boot/Image
