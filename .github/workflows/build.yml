name: Build Kernel A23 - NATHAN DYNAMIC FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Tools
        run: |
          # Clonando em pastas separadas e sem adivinhar subpastas
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 $GITHUB_WORKSPACE/clang_tools
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 $GITHUB_WORKSPACE/gcc_tools
          
      - name: Build Kernel (Dynamic Path Fix)
        run: |
          # A MÁGICA: Achar o caminho real do executável clang e do gcc
          REAL_CLANG_PATH=$(find $GITHUB_WORKSPACE/clang_tools -name clang -type f -executable | head -n 1 | xargs dirname)
          REAL_GCC_PATH=$(find $GITHUB_WORKSPACE/gcc_tools -name aarch64-linux-android-gcc -type f -executable | head -n 1 | xargs dirname)
          
          echo "Clang achado em: $REAL_CLANG_PATH"
          echo "GCC achado em: $REAL_GCC_PATH"
          
          # Adiciona ao PATH
          export PATH="$REAL_CLANG_PATH:$REAL_GCC_PATH:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # FIX DO NATHAN (Lixo no fim da linha)
          # Limpando o Makefile do vDSO para não gerar "junk"
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Ajustes para GSI Android 16
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO ---"
          # LLVM_IAS=0 usa o assembler do GCC (Fix do lixo/junk)
          yes "" | make -j$(nproc --all) O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=0 \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_GSI_Nathan_Final
          path: out/arch/arm64/boot/Image
