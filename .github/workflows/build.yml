name: Build Wonderful Kernel A23 - VDSO KILLER

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Cleanup Server
        uses: rokibhasansagar/slimhub_actions@main

      - name: Installing Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y lld binutils clang llvm zip flex bison libncurses-dev gawk libiberty-dev autoconf kmod bc build-essential gcc libc6 curl libstdc++6 git wget libssl-dev cpio p7zip-full ccache
          
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Google Build Tools
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 --single-branch -b master aosp-clang/clang
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 --single-branch -b android-14.0.0_r0.47 aosp-clang/gcc64
          
      - name: Build Kernel (Kill VDSO Error)
        run: |
          CLANG_BIN="$GITHUB_WORKSPACE/aosp-clang/clang/bin"
          GCC_BIN="$GITHUB_WORKSPACE/aosp-clang/gcc64/bin"
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          
          make mrproper
          mkdir -p out
          
          # 1. Gera a config base
          make O=out rsuntk_defconfig
          
          # 2. REMOVE O VDSO (O arquivo que dá erro de Assembler)
          sed -i 's/CONFIG_VDSO=y/CONFIG_VDSO=n/g' out/.config
          echo "CONFIG_VDSO=n" >> out/.config
          
          # 3. Força as respostas "Enter" para a nova config
          yes "" | make O=out oldconfig
          
          echo "--- DESATIVANDO TRAVAS DE SEGURANÇA ---"
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          
          echo "--- INICIANDO COMPILAÇÃO ---"
          # LLVM_IAS=1 agora é seguro porque o VDSO foi removido
          yes "" | make -j2 O=out CC=clang LLVM=1 LLVM_IAS=1 \
          KCFLAGS="-w -fno-builtin -fcommon -Wno-implicit-function-declaration" \
          CONFIG_VDSO=n \
          CONFIG_DEBUG_INFO_BTF=n \
          CONFIG_MODULE_SIG=n

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_KSU_NoVDSO
          path: out/arch/arm64/boot/Image
