name: Build Wonderful Kernel + KSU
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt update
          sudo apt install -y bc bison build-essential flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libncurses5-dev git curl

      - name: Fix AES Error (Importando o arquivo que você achou)
        run: |
          # Criamos a pasta e baixamos o arquivo corrigido
          mkdir -p arch/arm64/crypto/
          curl -LSs "https://raw.githubusercontent.com/itejo443/android_kernel_samsung_sm7225/ksm/arch/arm64/crypto/aes-modes.S" -o arch/arm64/crypto/aes-modes.S
          echo "Arquivo AES substituído para evitar erro de compilação!"

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          
          # 1. Tenta encontrar o melhor arquivo de configuração automaticamente
          # Ele vai buscar por 'a23', 'bengal' ou qualquer 'defconfig' se falhar
          CONF=$(find arch/arm64/configs/ -name "*a23q*" -o -name "*bengal*" | head -n 1 | sed 's|arch/arm64/configs/||')
          
          if [ -z "$CONF" ]; then
            echo "Aviso: Não achou nome específico, tentando o primeiro defconfig disponível..."
            CONF=$(ls arch/arm64/configs/ | grep _defconfig | head -n 1)
          fi

          echo "------------------------------------------"
          echo "MAPA SELECIONADO: $CONF"
          echo "------------------------------------------"
          
          make $CONF
          make -j$(nproc)

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Wonderful_Kernel_A23_KSU
          path: arch/arm64/boot/Image.gz-dtb
