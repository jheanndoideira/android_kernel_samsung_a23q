name: Build Kernel A23 - PROTOTYPE FIX

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Install Toolchain
        run: |
          sudo apt update
          sudo apt install -y clang-15 llvm-15 lld-15 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          
      - name: Compilar Kernel
        run: |
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          mkdir -p out
          
          # --- CORREÇÕES DE CÓDIGO (PATCHES) ---
          # 1. Fix vDSO
          sed -i 's/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags)/KBUILD_CFLAGS += $(arm64_relocate_vdso_flags) -fPIC -fno-stack-protector/g' arch/arm64/kernel/vdso/Makefile
          
          # 2. Fix Strict Prototypes (O erro que você achou!)
          sed -i 's/static void print_ssr_history()/static void print_ssr_history(void)/g' drivers/adsp_factory/ssc_core.c
          
          # --- CONFIGURAÇÃO ---
          make O=out rsuntk_defconfig
          
          # Responde 'Enter' para tudo (Anti-End-of-File)
          yes "" | make O=out olddefconfig
          
          # --- COMPILAÇÃO ---
          echo "--- INICIANDO COMPILAÇÃO ---"
          # Adicionamos -Wno-error para evitar que pequenos avisos virem erros fatais
          yes "" | make -j$(nproc --all) O=out \
          CC=clang-15 \
          LD=ld.lld-15 \
          AR=llvm-ar-15 \
          NM=llvm-nm-15 \
          OBJCOPY=llvm-objcopy-15 \
          OBJDUMP=llvm-objdump-15 \
          STRIP=llvm-strip-15 \
          LLVM_IAS=0 \
          KBUILD_MODPOST_WARN=1 \
          KCFLAGS="-w -Wno-error -fno-builtin -fcommon" \
          Image

      - name: Verificar e Upload
        run: |
          if [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image ./boot-A23-KSU.img
          else
            echo "Erro: Image não gerada."
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_KSU_Final
          path: ./boot-A23-KSU.img
