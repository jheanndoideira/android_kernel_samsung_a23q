name: Build Kernel A235M (Fixed)
on:
  workflow_dispatch:
    inputs:
      DEFCONFIG:
        description: Defconfig
        default: 'a23q_defconfig' # Nome mais comum no repo do potatogeek
        required: true
      KSU:
        description: Enable KernelSU
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        repository: potatogeek/kernel-a235m-f
        ref: main
        path: android_kernel_samsung_a23
        fetch-depth: 1
        
    - name: Prepare dependencies
      run: |
        sudo apt update -y
        sudo apt install bc cpio flex bison git gcc g++ python-is-python3 tar perl curl libc++-dev lz4 libssl-dev -y
        
    - name: Fetch Toolchain (Clang 18 Stable)
      run: |
        mkdir toolchains
        cd toolchains
        mkdir clang-18 && cd clang-18
        # Usando um link direto do Github para o Clang r450784d (Estável para Android 14)
        # Isso evita o erro 404 do googlesource
        wget -q https://github.com/ZyCromerZ/Clang/releases/download/18.0.0-20240404-release/Clang-18.0.0-20240404.tar.gz
        tar -xf Clang-18.0.0-20240404.tar.gz
        rm Clang-18.0.0-20240404.tar.gz
        cd ..
        git clone --depth=1 https://gitlab.com/Rissu-Projekt/toolchains/aarch64-linux-android.git google
      working-directory: android_kernel_samsung_a23

    - name: Build kernel (Final Turbo)
      id: buildKernel
      run: |
        export PATH=$(pwd)/toolchains/clang-18/bin:$(pwd)/toolchains/google/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # --- OTIMIZAÇÕES ---
        export CC=clang
        export LLVM=1
        export LLVM_IAS=1
        export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto"
        # -------------------

        # Instalação Segura do KernelSU (Link Oficial que não quebra)
        if [[ "${{ github.event.inputs.KSU }}" == "true" ]]; then
            echo "Instalando KernelSU..."
            curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        fi

        # Tenta achar o defconfig correto automaticamente
        if [ -f arch/arm64/configs/a23q_eur_open_defconfig ]; then
            export CONFIG_NAME="a23q_eur_open_defconfig"
        else
            export CONFIG_NAME="a23q_defconfig"
        fi
        
        echo "Usando Config: $CONFIG_NAME"
        make -C . O=out $CONFIG_NAME

        # Adiciona KSU na config se não tiver
        if [[ "${{ github.event.inputs.KSU }}" == "true" ]]; then
            echo "CONFIG_KSU=y" >> out/.config
        fi

        # Compilação
        make -j$(nproc --all) -C . O=out \
            CC=clang LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu-

        echo "buildDetails=A235M-Turbo-$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      working-directory: android_kernel_samsung_a23
      
    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.buildKernel.outputs.buildDetails }}
        path: android_kernel_samsung_a23/out/arch/arm64/boot/Image
