name: Build Kernel A23 - Android 16 GSI Ready

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Kernel For A23
    runs-on: ubuntu-latest
    
    steps:
      - name: Setup Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add KernelSU
        run: |
          # Versão main do KernelSU para garantir suporte ao Android 16
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
          
      - name: Download Tools
        run: |
          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master $GITHUB_WORKSPACE/clang-tools
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 -b android-14.0.0_r0.47 $GITHUB_WORKSPACE/gcc-tools
          
      - name: Build Kernel (GSI Optimized)
        run: |
          CLANG_BIN="$GITHUB_WORKSPACE/clang-tools/bin"
          GCC_BIN="$GITHUB_WORKSPACE/gcc-tools/bin"
          chmod +x $CLANG_BIN/clang
          
          export PATH="$CLANG_BIN:$GCC_BIN:$PATH"
          export ARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-android-
          export CROSS_COMPILE_ARM32=arm-linux-androideabi-
          
          # Fix do vDSO (Mata o Junk e mantém compatibilidade GSI)
          sed -i 's/-fno-asynchronous-unwind-tables//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/-fno-stack-protector//g' arch/arm64/kernel/vdso/Makefile
          
          make mrproper
          mkdir -p out
          make O=out rsuntk_defconfig
          
          # Desativar travas para a GSI não reclamar no boot
          scripts/config --file out/.config --disable MODULE_SIG
          scripts/config --file out/.config --disable SYSTEM_TRUSTED_KEYRING
          scripts/config --file out/.config --disable SYSTEM_REVOCATION_LIST
          
          yes "" | make O=out oldconfig
          
          echo "--- COMPILANDO PARA ANDROID 16 ---"
          yes "" | make -j$(nproc --all) O=out \
          CC=clang \
          LLVM=1 \
          LLVM_IAS=0 \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          KCFLAGS="-w -fno-builtin -fcommon"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: Kernel_A23_GSI_Android16
          path: out/arch/arm64/boot/Image
