name: A23_FORTRESS_OMEGA_V5
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject Root & FIX KernelSU (Compatibility Fix)
        run: |
          cd kernel_source
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
          
          # CORREÇÃO DE SEGURANÇA: No Kernel 4.19, task_work_add usa um booleano (true/1) 
          # em vez do enum TWA_RESUME. Isso mantém a funcionalidade original de segurança.
          sed -i 's/TWA_RESUME/1/g' drivers/kernelsu/allowlist.c
          
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # SUSFS (Stealth Security)
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

      - name: Header Mapping (Audio/Camera/Display)
        run: |
          ROOT=$(pwd)/kernel_source
          # Resolve caminhos sem mover arquivos (mais estável)
          ADR="$ROOT/techpack/audio/asoc/codecs/tas256x"
          mkdir -p $ADR/os_layer/inc
          cp $ADR/physical_layer/inc/*.h $ADR/os_layer/inc/ 2>/dev/null || true
          cp $ADR/logical_layer/inc/*.h $ADR/os_layer/inc/ 2>/dev/null || true
          
          # Fix Display Trace Path
          cd $ROOT/techpack/display/pll
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|g' pll_trace.h

      - name: Build Fortress (Security & Performance)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          cd kernel_source
          
          make vendor/a23_eur_open_defconfig
          
          # === BLOCO DE SEGURANÇA HARDENED ===
          ./scripts/config --enable CONFIG_STACKPROTECTOR_STRONG
          ./scripts/config --enable CONFIG_REFCOUNT_FULL
          ./scripts/config --enable CONFIG_PANIC_ON_REFCOUNT_ERROR
          ./scripts/config --enable CONFIG_HARDENED_USERCOPY
          ./scripts/config --enable CONFIG_FORTIFY_SOURCE
          ./scripts/config --enable CONFIG_STRICT_KERNEL_RWX
          
          # === PERFORMANCE & ROOT ===
          ./scripts/config --enable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_HZ_300
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_SUSFS
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          
          # Resposta automática para o menu (Shadow Call Stack e outras novidades)
          # Respondemos 'y' para Shadow Call Stack se o compilador oferecer, por segurança.
          printf "y\ny\ny\ny\ny\ny\n" | make olddefconfig || yes "" | make olddefconfig
          
          # Radar de Headers (Inclusão Absoluta)
          AUDIO_INC="-I$(pwd)/techpack/audio/asoc/codecs/tas256x/physical_layer/inc -I$(pwd)/techpack/audio/asoc/codecs/tas256x/os_layer/inc"
          CAM_INC="-I$(pwd)/techpack/camera/drivers/cam_req_mgr -I$(pwd)/techpack/camera/drivers/cam_utils"
          
          export KCFLAGS="-O3 -Ofast -w -pipe -march=armv8-a+crc+crypto -fno-builtin -fcommon $AUDIO_INC $CAM_INC"
          
          make -j$(nproc --all) \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-android- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=0

      - name: Create Artifacts
        run: |
          curl -LO https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img
      - uses: actions/upload-artifact@v4
        with:
          name: A23-FORTRESS-KERNEL
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
