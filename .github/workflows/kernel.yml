name: A23_Variant_F_HeaderHammer
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          ref: main
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Create Header Hammer
        run: |
          ROOT=$(pwd)/kernel_source
          mkdir -p $ROOT/fixed_headers
          # Copia todos os .h do techpack para uma pasta central
          find $ROOT/techpack -name "*.h" -exec cp {} $ROOT/fixed_headers/ \;
          # Cria a estrutura fake que o áudio pede
          mkdir -p $ROOT/fixed_headers/physical_layer/inc
          cp $ROOT/fixed_headers/*.h $ROOT/fixed_headers/physical_layer/inc/

      - name: Build with Hammer
        run: |
          # DEFINE AS VARIÁVEIS LÍDERES (O QUE FALTOU ANTES)
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          
          cd kernel_source
          make clean && make mrproper
          
          # AGORA ELE VAI ACHAR A PASTA CERTA
          make vendor/a23_eur_open_defconfig
          
          ./scripts/config --enable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          
          yes "" | make olddefconfig
          
          # Aponta para a pasta central de headers
          export KCFLAGS="-O3 -w -I$(pwd)/../fixed_headers"
          
          make -j$(nproc --all) CC=clang CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=0

      - name: Create VBMeta
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A23-HeaderHammer-Kernel
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
