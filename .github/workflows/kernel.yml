name: A23_Napalm_Strike_A16
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          ref: main
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Get Toolchains
        run: |
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject KernelSU Next
        run: |
          cd kernel_source
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu
          rm -rf temp_ksu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Inject SUSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
          cd kernel_source
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          if ! grep -q "susfs" fs/Makefile; then echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile; fi

      # === AQUI ESTÃO AS CORREÇÕES ATUALIZADAS ===
      - name: Apply Napalm Fixes (Audio/Camera/Display)
        run: |
          echo "=== 1. Correção do ÁUDIO (Raiz + Logical) ==="
          # Vai para a raiz do codec
          cd kernel_source/techpack/audio/asoc/codecs/tas256x/os_layer/src
          
          # Fix Raiz (para o arquivo .c)
          ln -sf ../../physical_layer physical_layer
          ln -sf ../../logical_layer logical_layer
          
          # Fix do Código (sed)
          sed -i 's|"os_layer/inc/tas256x-regmap.h"|"../inc/tas256x-regmap.h"|g' tas256x-codec.c
          sed -i 's|"algo/inc/tas_smart_amp_v2.h"|"../../algo/inc/tas_smart_amp_v2.h"|g' tas256x-codec.c
          
          # === O NOVO FIX DO ÁUDIO (Linha 4745) ===
          # O erro estava dentro de logical_layer/inc pedindo physical_layer
          cd logical_layer/inc
          ln -sf ../../physical_layer physical_layer
          
          # Volta para o Algo (Fix antigo da linha 30)
          cd ../../../../../algo/inc
          sed -i 's|"physical_layer/inc/tas256x.h"|"../../physical_layer/inc/tas256x.h"|g' tas_smart_amp_v2.h
          
          echo "=== 2. Correção da CÂMERA (Lista Completa) ==="
          cd $GITHUB_WORKSPACE/kernel_source/techpack/camera/drivers/cam_utils
          
          # Trazemos TODA a família de arquivos que ele pediu até agora
          ln -sf ../cam_req_mgr/cam_req_mgr_core.h cam_req_mgr_core.h
          ln -sf ../cam_req_mgr/cam_req_mgr_interface.h cam_req_mgr_interface.h
          ln -sf ../cam_req_mgr/cam_req_mgr_core_defs.h cam_req_mgr_core_defs.h
          
          # === O NOVO FIX DA CÂMERA (O erro do util.h) ===
          ln -sf ../cam_req_mgr/cam_req_mgr_util.h cam_req_mgr_util.h
          
          echo "=== 3. Correção do DISPLAY ==="
          cd $GITHUB_WORKSPACE/kernel_source/techpack/display/pll
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|g' pll_trace.h

      - name: Build Kernel (ANDROID 16 + BRUTE FORCE)
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          cd kernel_source
          make clean && make mrproper
          
          make vendor/a23_eur_open_defconfig
          
          # === CONFIG PARA ANDROID 16 ===
          ./scripts/config --file .config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_BPF_SYSCALL \
            --enable CONFIG_IP_NF_TARGET_TTL \
            --enable CONFIG_JUMP_LABEL \
            --enable CONFIG_HZ_300 \
            --enable CONFIG_PREEMPT \
            --disable CONFIG_HZ_100 \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_SAMSUNG_DEBUG \
            --disable CONFIG_FTRACE \
            --disable CONFIG_PROFILING \
            --disable CONFIG_AUDIT \
            --disable CONFIG_AUDITSYSCALL
            
          make olddefconfig
          
          echo "=== COMPILANDO (IGNORANDO ERROS NÃO-FATAIS) ==="
          # Flags agressivas para garantir que ele não pare por bobagem
          export KCFLAGS="-O3 -w -Wno-error -fno-builtin -fcommon -pipe -march=armv8-a+crc+crypto"
          
          make -j$(nproc --all) \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-android- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=0

      - name: Create VBMeta
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A23-Napalm-A16
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
