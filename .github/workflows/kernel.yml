name: A23_Final_Victory
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          ref: main
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Get Toolchains
        run: |
          mkdir toolchains && cd toolchains
          # Clang 12 (Estável)
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          # GCC 4.9 (Essencial para o fix de Assembly)
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject KernelSU Next
        run: |
          cd kernel_source
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu
          rm -rf temp_ksu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

      - name: Inject SUSFS
        run: |
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c kernel_source/fs/
          cp susfs4ksu/kernel_patches/include/linux/susfs.h kernel_source/include/linux/
          cd kernel_source
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          if ! grep -q "susfs" fs/Makefile; then echo "obj-\$(CONFIG_KSU_SUSFS) += susfs.o" >> fs/Makefile; fi

      # === CORREÇÃO CRÍTICA DE ÁUDIO ===
      # Cria o atalho que faltava para o tas256x.h ser encontrado
      - name: Fix Audio Driver Path
        run: |
          cd kernel_source/techpack/audio/asoc/codecs/tas256x/os_layer/src
          ln -sf ../../physical_layer physical_layer
          echo "Atalho de áudio criado."

      - name: Build Kernel (SILENT GAMER MODE)
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          cd kernel_source
          make clean && make mrproper
          
          # 1. Carrega a configuração correta
          make vendor/a23_eur_open_defconfig
          
          # 2. Aplica Performance + Remove Logs (Silent)
          ./scripts/config --file .config \
            --enable CONFIG_KSU \
            --enable CONFIG_KSU_SUSFS \
            --enable CONFIG_KSU_SUSFS_SUS_PATH \
            --enable CONFIG_KSU_SUSFS_SUS_MOUNT \
            --enable CONFIG_JUMP_LABEL \
            --enable CONFIG_HZ_300 \
            --enable CONFIG_PREEMPT \
            --disable CONFIG_HZ_100 \
            --disable CONFIG_DEBUG_KERNEL \
            --disable CONFIG_SAMSUNG_DEBUG \
            --disable CONFIG_FTRACE \
            --disable CONFIG_PROFILING \
            --disable CONFIG_AUDIT \
            --disable CONFIG_AUDITSYSCALL \
            --disable CONFIG_AUDIT_WATCH \
            --disable CONFIG_AUDIT_TREE
            
          make olddefconfig
          
          echo "=== INICIANDO COMPILAÇÃO (FIXED) ==="
          # LLVM_IAS=0 para corrigir o erro de criptografia
          export KCFLAGS="-O3 -pipe -march=armv8-a+crc+crypto"
          make -j$(nproc --all) \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-android- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=0

      - name: Create VBMeta
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: A23-Gamer-Kernel
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
