name: A23_NIGHT_MATRIX_9_WAYS
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [
          V25_FULL_POWER,
          V25_NO_LTO,
          V25_NO_POLLY,
          V25_FORCE_IGNORE,
          V25_NO_WG_SUSFS,
          V25_NO_WERROR,
          V25_STD_KSU,
          V25_O2_SAFE,
          V25_MINIMAL
        ]

    steps:
      - name: "Checkout Source"
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          path: kernel_source

      - name: "Setup Environment"
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python3 python2 device-tree-compiler -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: "Inject Root & Fixes (Base for ALL)"
        run: |
          cd kernel_source
          
          # --- LÓGICA DO KERNELSU (NEXT OU STD) ---
          if [[ "${{ matrix.variant }}" == "V25_STD_KSU" ]]; then
             echo "Usando KernelSU Padrão..."
             curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          else
             echo "Usando KernelSU Next..."
             git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
             mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
             sed -i 's/TWA_RESUME/1/g' drivers/kernelsu/allowlist.c
             echo "obj-y += kernelsu/" >> drivers/Makefile
             sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
             # Fix erro filter_count
             sed -i 's/atomic_set(&current->seccomp.filter_count, 0);/\/\/ atomic_set(&current->seccomp.filter_count, 0);/g' drivers/kernelsu/app_profile.c
          fi

          # Fix pgtable.h (Nuclear Fix)
          echo "#include <asm/pgtable.h>" > include/linux/pgtable.h

          # --- LÓGICA DO SUSFS/WIREGUARD ---
          if [[ "${{ matrix.variant }}" != "V25_NO_WG_SUSFS" ]]; then
             # SUSFS
             git clone https://gitlab.com/simonpunk/susfs4ksu.git
             cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
             patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
             # WireGuard
             git clone --depth 1 https://github.com/WireGuard/wireguard-linux-compat.git
             cp -R wireguard-linux-compat/src drivers/net/wireguard
             echo "obj-y += wireguard/" >> drivers/net/Makefile
          fi

      - name: "Surgeon Fix (Audio/Display/Cam)"
        run: |
          ROOT=$(pwd)/kernel_source
          
          # FIX AUDIO (Cópia Brutal)
          SRC_DIR="$ROOT/techpack/audio/asoc/codecs/tas256x/physical_layer"
          DEST_DIR="$ROOT/techpack/audio/asoc/codecs/tas256x/os_layer/src"
          cp -r $SRC_DIR $DEST_DIR/ 2>/dev/null || true
          cp $SRC_DIR/inc/*.h $ROOT/include/linux/ 2>/dev/null || true
          
          # Desativa travas Samsung
          find $ROOT -name "Kconfig*" -exec sed -i 's/bool "Samsung RKP"/bool/g' {} +

      - name: "Config & Build Strategy"
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          cd kernel_source
          
          make vendor/a23_eur_open_defconfig
          
          # Configs BASE (Anti-Travamento)
          ./scripts/config --disable CONFIG_RELR
          ./scripts/config --disable CONFIG_SHADOW_CALL_STACK
          ./scripts/config --set-val CONFIG_INIT_STACK_ALL_ZERO y
          ./scripts/config --set-val CONFIG_KPROBES y
          ./scripts/config --disable CONFIG_LTO_NONE
          
          # --- VARIAÇÕES DA MATRIX ---
          
          # Performance Base (LTO/Polly)
          if [[ "${{ matrix.variant }}" != "V25_NO_LTO" && "${{ matrix.variant }}" != "V25_MINIMAL" ]]; then
             ./scripts/config --enable CONFIG_LTO_CLANG_FULL
          fi
          
          if [[ "${{ matrix.variant }}" != "V25_NO_POLLY" && "${{ matrix.variant }}" != "V25_MINIMAL" ]]; then
             ./scripts/config --enable CONFIG_LLVM_POLLY
          fi
          
          # Flags Gerais
          if [[ "${{ matrix.variant }}" != "V25_MINIMAL" ]]; then
             ./scripts/config --enable CONFIG_HZ_300
             ./scripts/config --enable CONFIG_PREEMPT
             ./scripts/config --enable CONFIG_TCP_CONG_BBR
             ./scripts/config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
             ./scripts/config --enable CONFIG_IOSCHED_MAPLE
             ./scripts/config --set-str CONFIG_DEFAULT_IOSCHED "maple"
             ./scripts/config --enable CONFIG_DYNAMIC_FSYNC
             ./scripts/config --enable CONFIG_ZRAM_DEF_COMP_ZSTD
             ./scripts/config --enable CONFIG_ZSMALLOC
          fi
          
          # Android 16 & KSU (Sempre Ativos)
          ./scripts/config --enable CONFIG_PSI
          ./scripts/config --enable CONFIG_BPF_JIT
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_KSU
          if [[ "${{ matrix.variant }}" != "V25_NO_WG_SUSFS" ]]; then
             ./scripts/config --enable CONFIG_KSU_SUSFS
             ./scripts/config --enable CONFIG_WIREGUARD
          fi
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --disable CONFIG_RKP_KDP
          ./scripts/config --disable CONFIG_TIMA
          ./scripts/config --disable CONFIG_SEC_RESTRICT_ROOTING

          # Aceita Configs
          make olddefconfig
          
          # --- COMPILAÇÃO FINAL ---
          
          # Definição de Includes
          TP_PLL="-I$(pwd)/techpack/display/pll"
          TP_CAM="$(pwd)/techpack/camera/drivers/cam_sensor_module"
          CAM_INC="-I$TP_CAM/cam_cci -I$TP_CAM/cam_sensor_io -I$TP_CAM/cam_sensor_utils -I$(pwd)/techpack/camera/drivers/cam_req_mgr"
          
          # Otimização (-O3 ou -O2)
          OPT_LEVEL="-O3"
          if [[ "${{ matrix.variant }}" == "V25_O2_SAFE" ]]; then OPT_LEVEL="-O2"; fi
          
          # WError (Ignorar avisos?)
          W_FLAGS="-w"
          if [[ "${{ matrix.variant }}" == "V25_NO_WERROR" ]]; then W_FLAGS="-w -Wno-error"; fi
          
          export KCFLAGS="$OPT_LEVEL -Ofast $W_FLAGS -pipe -march=armv8-a+crc+crypto -mllvm -polly -fno-builtin -fcommon $TP_PLL $CAM_INC"
          
          # Force Ignore?
          MAKE_FLAGS=""
          if [[ "${{ matrix.variant }}" == "V25_FORCE_IGNORE" ]]; then MAKE_FLAGS="-k"; fi

          # COMANDO DE BUILD
          make -j$(nproc --all) $MAKE_FLAGS \
              CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
              LLVM=1 LLVM_IAS=0 \
              DTC_FLAGS="-@" \
              Image.gz-dtb

      - name: "Package ZIP"
        if: success() || ( matrix.variant == 'V25_FORCE_IGNORE' )
        run: |
          git clone https://github.com/osm0sis/AnyKernel3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's|block=/dev/block/platform/omap/omap_hsmmc.1/by-name/boot;|block=/dev/block/by-name/boot;|g' AnyKernel3/anykernel.sh
          
          if [ -f kernel_source/arch/arm64/boot/Image.gz-dtb ]; then
            cp kernel_source/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
            cd AnyKernel3 && zip -r9 ../A23-${{ matrix.variant }}.zip *
          else
            echo "Kernel Image not found! Build failed."
            exit 1
          fi

      - name: "Upload Artifact"
        if: success() || ( matrix.variant == 'V25_FORCE_IGNORE' )
        uses: actions/upload-artifact@v4
        with:
          name: A23-${{ matrix.variant }}-PACKAGE
          path: A23-${{ matrix.variant }}.zip
