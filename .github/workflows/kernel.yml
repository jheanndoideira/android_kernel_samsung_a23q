name: A23_OMEGA_SUPREME_A16
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject Root & Performance DNA
        run: |
          cd kernel_source
          # KernelSU Next & SUSFS
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

      - name: The Surgeon Fix (Audio/Camera/Display)
        run: |
          # Correção definitiva do Techpack
          cd kernel_source/techpack/audio/asoc/codecs/tas256x
          find . -type f -name "*.[ch]" -exec sed -i 's|physical_layer/inc/||g' {} +
          find . -type f -name "*.[ch]" -exec sed -i 's|logical_layer/inc/||g' {} +
          find . -name "*.h" -exec cp {} ./os_layer/src/ \; 2>/dev/null || true
          cd ../../../../display/pll
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|g' pll_trace.h

      - name: Build OMEGA (Ultimate Performance)
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          cd kernel_source
          
          make vendor/a23_eur_open_defconfig
          
          # === PERFORMANCE & REDE ===
          ./scripts/config --enable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_HZ_300
          ./scripts/config --enable CONFIG_TCP_CONG_BBR
          ./scripts/config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          
          # === ROOT & ANDROID 16 (OS DETALHES QUE FALTAVAM) ===
          ./scripts/config --enable CONFIG_KSU
          ./scripts/config --enable CONFIG_KSU_SUSFS
          ./scripts/config --enable CONFIG_KPROBES
          ./scripts/config --enable CONFIG_KALLSYMS_ALL
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --enable CONFIG_MODULES
          
          # === LIMPEZA DE SEGURANÇA (PARA PERFORMANCE) ===
          ./scripts/config --disable CONFIG_SHADOW_CALL_STACK
          ./scripts/config --disable CONFIG_DEBUG_KERNEL
          ./scripts/config --disable CONFIG_SAMSUNG_DEBUG_LOG
          
          yes "" | make olddefconfig
          
          # Flags "Extreme" de Compilação
          ADR="techpack/audio/asoc/codecs/tas256x"
          export KCFLAGS="-O3 -Ofast -w -pipe -march=armv8-a+crc+crypto -fno-builtin -fcommon -I$(pwd)/$ADR/physical_layer/inc -I$(pwd)/$ADR/logical_layer/inc"
          
          make -j$(nproc --all) \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-android- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=0

      - name: Create Artifacts
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py || curl -LO https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img
      - uses: actions/upload-artifact@v4
        with:
          name: A23-OMEGA-SUPREME
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
