name: A23_Alpha_LIDER_Omega
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          ref: main
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject KSU & SUSFS
        run: |
          cd kernel_source
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

      - name: The Audio Bridge (Fixing tas256x-logic.h)
        run: |
          ROOT=$(pwd)/kernel_source
          ADR="$ROOT/techpack/audio/asoc/codecs/tas256x"
          
          # Esta é a pasta onde o erro aconteceu:
          LOGIC_DIR="$ADR/os_layer/src/logical_layer/inc"
          
          # Criamos a ponte física para o arquivo ser encontrado:
          mkdir -p $LOGIC_DIR/physical_layer/inc
          cp $ADR/physical_layer/inc/tas256x.h $LOGIC_DIR/physical_layer/inc/
          
          # Fix extra para o outro arquivo de áudio:
          mkdir -p $ADR/os_layer/src/physical_layer/inc
          cp $ADR/physical_layer/inc/tas256x.h $ADR/os_layer/src/physical_layer/inc/
          
          # Fix Display Trace
          cd $ROOT/techpack/display/pll
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|g' pll_trace.h

      - name: Build Alpha Omega
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          
          cd kernel_source
          make clean && make mrproper
          make vendor/a23_eur_open_defconfig
          
          # CONFIGURAÇÃO "MURO DE FERRO" (Força o LTO e Android 16 sem perguntas)
          ./scripts/config --file .config --enable CONFIG_LTO_CLANG_FULL
          ./scripts/config --file .config --disable CONFIG_LTO_NONE
          ./scripts/config --file .config --disable CONFIG_SHADOW_CALL_STACK
          ./scripts/config --file .config --enable CONFIG_OVERLAY_FS
          ./scripts/config --file .config --enable CONFIG_BPF_SYSCALL
          ./scripts/config --file .config --enable CONFIG_KSU
          
          # O "yes" definitivo para qualquer pergunta surpresa:
          yes "" | make olddefconfig
          
          echo "=== INICIANDO COMPILAÇÃO FINAL ==="
          # Injetamos o caminho base do techpack para garantir
          export KCFLAGS="-O3 -w -fno-builtin -fcommon -I$(pwd)/techpack/audio/asoc/codecs/tas256x/physical_layer/inc"
          
          make -j$(nproc --all) \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-android- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              LLVM=1 \
              LLVM_IAS=0

      - name: Create VBMeta & Upload
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img
      - uses: actions/upload-artifact@v4
        with:
          name: A23-Alpha-Omega-Kernel
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
