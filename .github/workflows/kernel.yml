name: A23_Variant_D_Injector
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          repository: potatogeek/kernel-a235m-f
          ref: main
          path: kernel_source

      - name: Setup Environment
        run: |
          sudo apt update -y
          sudo apt install bc cpio flex bison git gcc g++ tar perl curl libc++-dev lz4 libssl-dev python2 -y
          sudo ln -sf /usr/bin/python2 /usr/bin/python
          mkdir toolchains && cd toolchains
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r416183b1.git clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 google

      - name: Inject KSU & SUSFS
        run: |
          cd kernel_source
          git clone --depth 1 https://github.com/rifsxd/KernelSU-Next temp_ksu
          mv temp_ksu/kernel drivers/kernelsu && rm -rf temp_ksu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          git clone https://gitlab.com/simonpunk/susfs4ksu.git
          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ && cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true

      - name: Modify Main Makefile (Injection)
        run: |
          cd kernel_source
          
          # Define os caminhos problemáticos
          AUD_PATH="techpack/audio/asoc/codecs/tas256x"
          CAM_PATH="techpack/camera/drivers"
          
          # Injeta na variável LINUXINCLUDE do Makefile raiz
          # Isso força esses caminhos a serem vistos por TODO O SISTEMA
          sed -i "s|^LINUXINCLUDE.*|& -I\$(srctree)/$AUD_PATH/physical_layer/inc -I\$(srctree)/$AUD_PATH/logical_layer/inc -I\$(srctree)/$AUD_PATH/algo/inc -I\$(srctree)/$CAM_PATH/cam_sensor_module/cam_cci|" Makefile
          
          # Correção extra para garantir
          sed -i "s|^USERINCLUDE.*|& -I\$(srctree)/$AUD_PATH/physical_layer/inc -I\$(srctree)/$AUD_PATH/logical_layer/inc|" Makefile
          
          # Display Fix
          cd techpack/display/pll
          sed -i 's|#define TRACE_INCLUDE_PATH .|#define TRACE_INCLUDE_PATH ../../techpack/display/pll|g' pll_trace.h

      - name: Build with Injection Method
        run: |
          export PATH=$(pwd)/toolchains/clang/bin:$(pwd)/toolchains/google/bin:$PATH
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          cd kernel_source
          
          make clean && make mrproper
          make vendor/a23_eur_open_defconfig
          
          ./scripts/config --enable CONFIG_LTO_CLANG_FULL
          ./scripts/config --enable CONFIG_OVERLAY_FS
          ./scripts/config --enable CONFIG_BPF_SYSCALL
          
          yes "" | make olddefconfig
          
          # Sem flags extras aqui, porque já editamos o Makefile
          make -j$(nproc --all) CC=clang CROSS_COMPILE=aarch64-linux-android- LLVM=1 LLVM_IAS=0 KCFLAGS="-O3 -w"

      - name: Create VBMeta & Upload
        run: |
          wget https://raw.githubusercontent.com/external-avb/avb/master/avbtool.py
          python3 avbtool.py make_vbmeta_image --flags 2 --padding_size 4096 --output vbmeta_disabled.img
      - uses: actions/upload-artifact@v4
        with:
          name: A23-Injector-Kernel
          path: |
            kernel_source/arch/arm64/boot/Image
            vbmeta_disabled.img
